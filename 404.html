<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Sugrowth</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="hero" id="main">
      <div class="container hero-layout">
        <div class="hero-copy reveal is-visible">
          <div class="hero-meta">
            <span>404</span>
            <span>sugrowth.ca</span>
          </div>
          <p class="eyebrow">Route not found</p>
          <h1>Not found</h1>
          <p class="hero-lede">This page does not exist on sugrowth.ca.</p>
          <div class="hero-actions">
            <a class="button button-primary" href="/">Go home</a>
            <a class="button button-secondary" href="mailto:support@sugrowth.ca">Contact support</a>
          </div>
        </div>
        <div class="signal-system reveal is-visible" aria-hidden="true">
          <div class="signal-header">
            <span>Missing route</span>
            <strong>SG-404</strong>
          </div>
          <div class="signal-mark">
            <img src="assets/sugrowth-mark.png" alt="">
          </div>
          <div class="signal-routes">
            <div>
              <span>01</span>
              <strong>Return home</strong>
              <small>sugrowth.ca</small>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
